<!DOCTYPE html>

   <html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <!--=============== REMIXICONS ===============-->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">

      <!--=============== CSS ===============-->
      <link rel="stylesheet" href="assets/styles/style.css">

      <title>Burger Website</title>
   </head>

   <body>
      <!--==================== HEADER ====================-->
      <header class="header" id="header">

       <nav class="nav container">
         <span class="nav-logo">
          Burger
         </span>
          
          <div class="nav-menu" id="nav-menu">
            <ul class="nav-list">
              <li>
                <a href="#home" class="nav-link">Home</a>
              </li>
              
              <li>
                <a href="#about" class="nav-link">About</a>
              </li>
              
              <li>
                <a href="#contact" class="nav-link">Contact</a>
              </li>
            </ul>
            
            <div class="nav-close" id="nav-close">
              <i class="ri-close-large-line"></i>
            </div>
          </div>
          
          <div class="nav-toggle" id="nav-toggle">
            <i class="ri-menu-fill"></i>
          </div>
        </nav>
      </header>

      <!--==================== MAIN ====================-->
      <main class="main">
         <!--==================== HOME ====================-->
         <section class="home section" id="home">
            <div class="home-container container grid">
               <div class="home-data">
                  <h1 class="home-title">
                     Crafted Burgers,
                     Made to Satisfy.
                  </h1>
                  
                  <p class="home-description">
                     Fresh ingredients, juicy burgers, and unforgettable flavor. 
                     Order your favorite meal in just a few clicks.
                  </p>
                  
                  <a href="#popular" class="btn">
                     Order Now!
                  </a>
               </div>
               
               <div class="home-image">
                  <img src="assets/img/home-img.webp" class="home-img">
               </div>
            </div>
         </section>

         <!--==================== ABOUT ====================-->
         <section class="about section" id="about">

         </section>

         <!--==================== CONTACT ====================-->
         <section class="contact section" id="contact">

         </section>
      </main>

      <!--==================== FOOTER ====================-->
      <footer class="footer">

      </footer>

      <!--========== SCROLL UP ==========-->


      <!--=============== SCROLLREVEAL ===============-->
      <script src="assets/scripts/scrollreveal.min.js"></script>

      <!--=============== MAIN JS ===============-->
      <script src="assets/scripts/main.js"></script>
   </body>
</html>
